<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f7a5c">
<meta name="description" content="מנטור אישי לירידה במשקל ואורח חיים בריא — מסע של שנה, יעד של 40 ק״ג. תכנית, מעקב, ותמיכה יומית.">
<title>המנטור שלי · מסע לאיזון</title>
<style>
/* ========================================================================
   המנטור שלי — Design System
   מטרה: כלי יומיומי, חם ומכיל, לירידה של 40 ק״ג לאורך שנה.
   שפה: עברית (RTL). מובייל-פירסט. כל הנתונים נשמרים מקומית בדפדפן.
   ======================================================================== */
:root{
  --bg:#f4f7f5;
  --bg-soft:#eaf1ec;
  --card:#ffffff;
  --ink:#152a22;
  --ink-soft:#4a6157;
  --muted:#87998f;
  --line:#e0e8e2;
  --brand:#0f7a5c;
  --brand-600:#0c684e;
  --brand-100:#d9efe6;
  --accent:#e8823a;
  --accent-100:#fbe7d6;
  --good:#2fa06b;
  --warn:#e0a13b;
  --bad:#d1584f;
  --gold:#caa54a;
  --shadow:0 6px 22px rgba(19,42,34,.08);
  --shadow-lg:0 14px 40px rgba(19,42,34,.16);
  --r:20px;
  --r-sm:13px;
  --safe-b:env(safe-area-inset-bottom,0px);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Assistant","Heebo",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  line-height:1.55;font-size:16px;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
a{color:var(--brand);text-decoration:none}
.app{max-width:520px;margin:0 auto;min-height:100%;position:relative;padding-bottom:calc(84px + var(--safe-b))}

/* ---------- Header ---------- */
.top{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,var(--bg) 70%,rgba(244,247,245,0));
  padding:14px 18px 8px;
}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{
  width:38px;height:38px;border-radius:12px;flex:0 0 auto;
  background:linear-gradient(140deg,var(--brand),#16a377);
  display:grid;place-items:center;color:#fff;font-size:20px;
  box-shadow:0 4px 12px rgba(15,122,92,.35);
}
.brand h1{font-size:17px;font-weight:800;letter-spacing:-.2px}
.brand .sub{font-size:11.5px;color:var(--muted);font-weight:600}
.chip-day{
  background:var(--brand-100);color:var(--brand-600);
  font-weight:800;font-size:12px;padding:7px 11px;border-radius:999px;white-space:nowrap;
}

/* ---------- Generic ---------- */
.view{padding:6px 16px 20px;animation:rise .32s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{
  background:var(--card);border-radius:var(--r);padding:18px;
  box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:14px;
}
.card.tight{padding:14px}
.card h2{font-size:16px;font-weight:800;margin-bottom:4px}
.section-title{font-size:13px;font-weight:800;color:var(--muted);
  text-transform:uppercase;letter-spacing:.6px;margin:20px 4px 10px}
.row{display:flex;gap:10px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--muted)}
.soft{color:var(--ink-soft)}
.center{text-align:center}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;
  padding:5px 10px;border-radius:999px;background:var(--bg-soft);color:var(--ink-soft)}
.pill.brand{background:var(--brand-100);color:var(--brand-600)}
.pill.accent{background:var(--accent-100);color:#b45b1e}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--brand);color:#fff;font-weight:800;font-size:15px;
  padding:14px 18px;border-radius:14px;width:100%;
  box-shadow:0 6px 16px rgba(15,122,92,.28);transition:transform .1s,filter .1s;
}
.btn:active{transform:translateY(1px) scale(.995);filter:brightness(.97)}
.btn.ghost{background:var(--bg-soft);color:var(--ink);box-shadow:none}
.btn.accent{background:var(--accent);box-shadow:0 6px 16px rgba(232,130,58,.3)}
.btn.sm{width:auto;padding:10px 14px;font-size:13.5px;border-radius:11px}
.btn.danger{background:#fbeae8;color:var(--bad);box-shadow:none}

/* ---------- Forms ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-weight:800;font-size:13.5px;margin-bottom:7px}
.field .hint{font-weight:600;color:var(--muted);font-size:12px;margin-bottom:7px}
.input,select.input,textarea.input{
  width:100%;background:var(--bg-soft);border:1.5px solid transparent;
  border-radius:13px;padding:13px 14px;color:var(--ink);transition:border .15s,background .15s;
}
.input:focus{outline:none;border-color:var(--brand);background:#fff}
textarea.input{resize:vertical;min-height:88px;line-height:1.6}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{
  flex:1;min-width:calc(50% - 4px);background:var(--bg-soft);border:1.5px solid transparent;
  border-radius:13px;padding:12px 8px;font-weight:700;font-size:13.5px;color:var(--ink-soft);
  transition:all .15s;text-align:center;line-height:1.35;
}
.seg button small{display:block;font-weight:600;color:var(--muted);font-size:11px;margin-top:2px}
.seg button.on{background:var(--brand-100);border-color:var(--brand);color:var(--brand-600)}
.seg button.on small{color:var(--brand-600);opacity:.85}

/* ---------- Progress ring & bars ---------- */
.ring{--p:0;width:150px;height:150px;border-radius:50%;margin:2px auto 6px;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--bg-soft) 0);
  display:grid;place-items:center;position:relative;transition:background .6s ease}
.ring::before{content:"";position:absolute;inset:13px;background:var(--card);border-radius:50%}
.ring .in{position:relative;text-align:center}
.ring .in b{font-size:30px;font-weight:900;letter-spacing:-1px}
.ring .in span{font-size:12px;color:var(--muted);font-weight:700;display:block}
.bar{height:10px;border-radius:999px;background:var(--bg-soft);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--brand);transition:width .5s ease}
.bar.water>i{background:linear-gradient(90deg,#3aa0d8,#5bc0eb)}
.bar.cal>i{background:linear-gradient(90deg,var(--accent),#f0a262)}

/* ---------- Stat tiles ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;box-shadow:var(--shadow)}
.tile b{font-size:24px;font-weight:900;letter-spacing:-.5px;display:block}
.tile .lbl{font-size:12px;color:var(--muted);font-weight:700}
.tile .delta{font-size:12px;font-weight:800}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}

/* ---------- Mentor / chat ---------- */
.mentor-note{
  background:linear-gradient(135deg,#0f7a5c,#12946f);color:#fff;border-radius:var(--r);
  padding:18px;box-shadow:var(--shadow-lg);margin-bottom:14px;position:relative;overflow:hidden;
}
.mentor-note::after{content:"";position:absolute;left:-30px;bottom:-40px;width:150px;height:150px;
  background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%)}
.mentor-note .who{display:flex;align-items:center;gap:9px;margin-bottom:9px;font-weight:800;font-size:13px;opacity:.95}
.mentor-note .who .av{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:17px}
.mentor-note p{font-size:15.5px;font-weight:600;position:relative;z-index:1}
.chat{display:flex;flex-direction:column;gap:10px;padding:4px 0 8px}
.bubble{max-width:86%;padding:12px 15px;border-radius:17px;font-size:14.5px;line-height:1.55;white-space:pre-wrap}
.bubble.me{align-self:flex-start;background:var(--brand);color:#fff;border-bottom-right-radius:5px}
.bubble.bot{align-self:flex-end;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px;box-shadow:var(--shadow)}
.quick{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{white-space:nowrap;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:9px 14px;font-weight:700;font-size:13px;color:var(--ink-soft);box-shadow:var(--shadow)}
.chatbar{display:flex;gap:8px;position:sticky;bottom:0;padding:8px 0;background:linear-gradient(0deg,var(--bg) 75%,transparent)}
.chatbar input{flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 15px}
.chatbar input:focus{outline:none;border-color:var(--brand)}
.chatbar button{width:50px;flex:0 0 auto;border-radius:14px;background:var(--brand);color:#fff;font-size:20px;font-weight:800}

/* ---------- Habits / checklist ---------- */
.habit{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.habit:last-child{border-bottom:none}
.habit .box{width:28px;height:28px;flex:0 0 auto;border-radius:9px;border:2px solid var(--line);
  display:grid;place-items:center;font-size:16px;color:transparent;transition:all .15s}
.habit.done .box{background:var(--good);border-color:var(--good);color:#fff}
.habit .t{flex:1;font-weight:700;font-size:14.5px}
.habit.done .t{color:var(--muted);text-decoration:line-through}
.habit .emo{font-size:19px}

/* ---------- Journey / roadmap ---------- */
.road{position:relative;padding-inline-start:6px}
.milestone{display:flex;gap:14px;position:relative;padding-bottom:20px}
.milestone::before{content:"";position:absolute;inset-inline-start:15px;top:30px;bottom:-4px;width:2px;background:var(--line)}
.milestone:last-child::before{display:none}
.milestone .dot{width:32px;height:32px;flex:0 0 auto;border-radius:50%;background:var(--bg-soft);
  border:2px solid var(--line);display:grid;place-items:center;font-size:15px;font-weight:800;color:var(--muted);z-index:1}
.milestone.done .dot{background:var(--good);border-color:var(--good);color:#fff}
.milestone.now .dot{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 5px var(--accent-100)}
.milestone .body{flex:1;padding-top:2px}
.milestone .body h3{font-size:14.5px;font-weight:800}
.milestone .body .kg{font-size:12.5px;font-weight:800;color:var(--brand-600)}
.milestone .body p{font-size:13px;color:var(--ink-soft);margin-top:3px}

/* ---------- Nutrition cards ---------- */
.swap{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.swap:last-child{border-bottom:none}
.swap .from{color:var(--bad);font-weight:700;flex:1}
.swap .arw{color:var(--muted)}
.swap .to{color:var(--good);font-weight:800;flex:1;text-align:start}
.plate{display:flex;border-radius:16px;overflow:hidden;height:20px;margin:12px 0 6px}
.plate>div{display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff}
.acc{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:10px;overflow:hidden}
.acc>summary{list-style:none;padding:14px 16px;font-weight:800;font-size:14.5px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:"+";color:var(--brand);font-size:20px;font-weight:700}
.acc[open]>summary::after{content:"–"}
.acc .inner{padding:0 16px 16px;font-size:14px;color:var(--ink-soft)}
.acc .inner li{margin:6px 0;padding-inline-start:2px}
.acc .inner ul{padding-inline-start:18px}

/* ---------- Bottom nav ---------- */
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  max-width:520px;margin:0 auto;
  background:rgba(255,255,255,.92);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  display:flex;padding:8px 6px calc(8px + var(--safe-b));
}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:4px 2px;color:var(--muted);font-size:10.5px;font-weight:800;transition:color .15s}
.nav button .ic{font-size:21px;transition:transform .15s}
.nav button.on{color:var(--brand)}
.nav button.on .ic{transform:translateY(-2px) scale(1.06)}

/* ---------- Misc ---------- */
.note-box{background:var(--accent-100);border-radius:var(--r-sm);padding:12px 14px;font-size:12.5px;color:#8a4a17;font-weight:600;display:flex;gap:8px}
.hr{height:1px;background:var(--line);margin:14px 0;border:none}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;font-size:14px;
  box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:all .3s;z-index:60;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}
.badge-streak{display:inline-flex;align-items:center;gap:5px;background:var(--accent-100);color:#b45b1e;font-weight:900;padding:6px 12px;border-radius:999px;font-size:14px}

/* onboarding hero */
.hero{padding:26px 20px 10px;text-align:center}
.hero .big-logo{width:74px;height:74px;border-radius:22px;margin:0 auto 16px;
  background:linear-gradient(140deg,var(--brand),#16a377);display:grid;place-items:center;font-size:38px;
  box-shadow:0 12px 30px rgba(15,122,92,.4)}
.hero h1{font-size:25px;font-weight:900;letter-spacing:-.5px;line-height:1.25}
.hero p{color:var(--ink-soft);margin-top:10px;font-size:15px}
.steps{display:flex;gap:6px;justify-content:center;margin:18px 0}
.steps i{width:26px;height:5px;border-radius:999px;background:var(--line)}
.steps i.on{background:var(--brand);width:30px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   State + persistence
   ============================================================ */
const KEY='mentor_state_v1';
const todayISO=()=>new Date().toISOString().slice(0,10);
const DAY=864e5;

const DEFAULT={
  onboarded:false,
  profile:{name:'',sex:'female',age:35,height:165,startWeight:0,goalLoss:40,activity:1.375,startDate:todayISO()},
  targets:{calories:0,water:8,carbs:25}, // carbs = פחמימות נטו ליום (קיטו)
  training:{sets:3,reps:10,levels:{}}, // רמת כל תרגיל + סבבים/חזרות
  weights:[],          // {date, kg}
  days:{},             // date -> {habits:{}, water:int, mood:'', journal:''}
  chat:[],             // {who:'me'|'bot', text, t}
  streak:0, lastActive:''
};

let S=load();
function load(){
  try{const r=JSON.parse(localStorage.getItem(KEY));return r?{...structuredClone(DEFAULT),...r}:structuredClone(DEFAULT);}
  catch(e){return structuredClone(DEFAULT);}
}
function save(){localStorage.setItem(KEY,JSON.stringify(S));}
function today(){
  const d=todayISO();
  if(!S.days[d])S.days[d]={habits:{},water:0,mood:'',journal:''};
  return S.days[d];
}

/* ============================================================
   Health math (Mifflin–St Jeor)  — כל היעדים בטווח בטוח
   ============================================================ */
function bmr(){
  const p=S.profile, w=currentWeight(), h=p.height, a=p.age;
  const base=10*w+6.25*h-5*a;
  return Math.round(p.sex==='male'?base+5:base-161);
}
function tdee(){return Math.round(bmr()*S.profile.activity);}
function calorieTarget(){
  // גירעון בטוח ~500-750 קק"ל, אך לא מתחת לרצפה בריאה
  const t=tdee();
  let target=t-650;
  const floor=S.profile.sex==='male'?1500:1200;
  return Math.max(floor,Math.round(target/10)*10);
}
/* מאקרו קטוגני: פחמימות נטו נמוכות · חלבון מתון · שומן ממלא את השאר */
function macros(){
  const cals=S.targets.calories||calorieTarget();
  const carb=S.targets.carbs||25;                              // גרם פחמימות נטו ליום
  const prot=Math.max(80,Math.round(currentWeight()*1.2));     // חלבון מתון־משביע
  const fat=Math.max(40,Math.round((cals-carb*4-prot*4)/9));   // שומן = שאר הקלוריות
  const p=g=>Math.round(g/((carb*4+prot*4+fat*9))*100);
  return {cals,carb,prot,fat,pct:{carb:p(carb*4),prot:p(prot*4),fat:p(fat*9)}};
}
function currentWeight(){
  if(S.weights.length)return S.weights[S.weights.length-1].kg;
  return S.profile.startWeight||80;
}
function goalWeight(){return +(S.profile.startWeight-S.profile.goalLoss).toFixed(1);}
function lostKg(){return +(S.profile.startWeight-currentWeight()).toFixed(1);}
function pctToGoal(){
  const g=S.profile.goalLoss;if(g<=0)return 0;
  return Math.max(0,Math.min(100,Math.round(lostKg()/g*100)));
}
function daysIn(){return Math.max(0,Math.floor((Date.parse(todayISO())-Date.parse(S.profile.startDate))/DAY));}
function weeklyRate(){ // ק"ג לשבוע בפועל
  if(S.weights.length<2)return 0;
  const first=S.weights[0], last=S.weights[S.weights.length-1];
  const wks=Math.max(1,(Date.parse(last.date)-Date.parse(first.date))/DAY/7);
  return +((first.kg-last.kg)/wks).toFixed(2);
}
function etaText(){
  const rate=weeklyRate();const remain=currentWeight()-goalWeight();
  if(rate<=0.05||remain<=0)return null;
  const wks=Math.ceil(remain/rate);
  const d=new Date(Date.now()+wks*7*DAY);
  return d.toLocaleDateString('he-IL',{month:'long',year:'numeric'});
}

/* streak */
function touchStreak(){
  const d=todayISO();
  if(S.lastActive===d)return;
  const y=new Date(Date.now()-DAY).toISOString().slice(0,10);
  S.streak=(S.lastActive===y)?S.streak+1:1;
  S.lastActive=d;save();
}

/* ============================================================
   Utilities
   ============================================================ */
const $=(s,r=document)=>r.querySelector(s);
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),2200);}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

/* ============================================================
   HABITS + monthly roadmap content
   ============================================================ */
const HABITS=[
  {id:'carbs',t:'מתחת ל־25 ג׳ פחמימות נטו',emo:'🥑'},
  {id:'fat',t:'שומן בריא בכל ארוחה',emo:'🧈'},
  {id:'protein',t:'חלבון במידה מתונה',emo:'🍳'},
  {id:'electro',t:'אלקטרוליטים — מלח, מים, מגנזיום',emo:'🧂'},
  {id:'water',t:'לשתות מים לאורך היום',emo:'💧'},
  {id:'move',t:'תנועה — 20–30 דק׳',emo:'🚶'},
  {id:'sleep',t:'שינה טובה בזמן',emo:'😴'},
];
const ROADMAP=[
  {m:1,kg:3,title:'חודש 1 · כניסה לקטוזיס',p:'מורידים פחמימות מתחת ל־25 ג׳ נטו, מוסיפים שומן בריא ומקפידים על אלקטרוליטים. השבוע הראשון עלול להרגיש "שפעת קיטו" — זה חולף.'},
  {m:2,kg:7,title:'חודש 2 · הסתגלות לשומן',p:'הגוף לומד לשרוף שומן כדלק. האנרגיה מתייצבת, התיאבון יורד, והצום בין הארוחות נעשה טבעי.'},
  {m:3,kg:11,title:'חודש 3 · שליטה במאקרו',p:'מזהים פחמימות נסתרות, קוראים תוויות, ומכוונים במדויק שומן/חלבון/פחמימה. מוסיפים אימוני התנגדות.'},
  {m:4,kg:15,title:'חודש 4 · ניהול טריגרים',p:'מזהים מתי בא לנו סוכר מסיבה רגשית, ובונים תגובה קטוגנית חלופית שמרגיעה בלי לצאת מקטוזיס.'},

const LEVELS=[['kal','קל','נקודת פתיחה','😌'],['basis','בסיס','היעד','🎯'],['kashe','קשה','התקדמות','🔥']];
const EXERCISES=[
  {id:'squat', n:1, he:'סקוואט', en:'Squat', emo:'🦵', levels:{
    kal:'קימה וישיבה מכיסא — שולטים בירידה ובעלייה.',
    basis:'סקוואט מלא, ירכיים עד גובה הברכיים.',
    kashe:'מחזיקים משקל בחזה, או ירידה איטית 3 שניות.'}},
  {id:'bridge', n:2, he:'הרמת אגן', en:'Glute Bridge', emo:'🍑', levels:{
    kal:'גשר רגיל, שתי רגליים, בלי עצירה.',
    basis:'עם עצירה ולחיצת ישבן 2 שניות למעלה.',
    kashe:'גשר על רגל אחת, או משקל על האגן.'}},
  {id:'pushup', n:3, he:'שכיבות סמיכה', en:'Push-up', emo:'💪', levels:{
    kal:'בעמידה מול קיר — דוחפים ומתקרבים.',
    basis:'בזווית מול השיש או משטח נמוך יותר.',
    kashe:'מהרצפה — קודם על הברכיים, אחר כך מלא.'}},
  {id:'row', n:4, he:'חתירה', en:'Row', emo:'🚣', levels:{
    kal:'יד נשענת על כיסא, מושכים משקל קל ביד השנייה.',
    basis:'כפיפה עם שני בקבוקים, מרפקים אחורה.',
    kashe:'משקל כבד יותר, או חתירה הפוכה מתחת לשולחן.'}},
  {id:'lunge', n:5, he:'פסיעות', en:'Lunges', emo:'🚶', levels:{
    kal:'פסיעה במקום, יד אוחזת בכיסא לתמיכה.',
    basis:'צעד קדימה, ברך אחורית כמעט נוגעת, מתחלפים.',
    kashe:'פסיעות בהליכה קדימה, או עם משקל בידיים.'}},
];
function trainDay(){const d=today();if(!d.workout)d.workout={};return d.workout;}
function exLevel(id){return (S.training.levels&&S.training.levels[id])||'kal';}
function workoutDoneOn(date){const w=(S.days[date]&&S.days[date].workout)||{};return EXERCISES.every(e=>w[e.id]);}
function workoutCount(date){const w=(S.days[date]&&S.days[date].workout)||{};return EXERCISES.filter(e=>w[e.id]).length;}
function trainedIn(days){let c=0;for(let i=0;i<days;i++){const d=new Date(Date.now()-i*DAY).toISOString().slice(0,10);if(workoutDoneOn(d))c++;}return c;}

let TAB='home';

  const app=$('#app');

  touchStreak();
  app.innerHTML=`
    ${header()}
    <div class="view" id="view">${views[TAB]()}</div>
    ${nav()}
  `;
  binders[TAB]&&binders[TAB]();
  bindNav();
}
function go(tab){TAB=tab;render();window.scrollTo({top:0});}

  const p=S.profile;
  return `<header class="top"><div class="top-row">

  <div class="note-box" style="margin-top:2px">📈 <span><b>עומס מתקדם:</b> אפשר להתחזק גם בתוך אותה רמה — קודם עוד חזרה או עוד סבב, אחר כך משקל, אחר כך ירידה איטית יותר. כל שבוע קצת יותר ממה שהיה נוח בפעם הקודמת. זה מה ששומר על השריר.</span></div>

  <div class="section-title">עקביות</div>

    <div class="tiles" style="margin-bottom:14px">

      <div class="tile"><span class="lbl">30 יום</span><b>${month}</b><span class="muted" style="font-size:12px">אימונים מלאים</span></div>

  `;
};
binders.train=function(){
  const w=trainDay();
  // level selection per exercise
  document.querySelectorAll('.exlvl').forEach(seg=>{
    const id=seg.dataset.ex, ex=EXERCISES.find(e=>e.id===id);
    seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      const lv=b.dataset.lv;
      if(!S.training.levels)S.training.levels={};
      S.training.levels[id]=lv;save();
      seg.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
      seg.parentElement.querySelector('.lvdesc').textContent=ex.levels[lv];
    });
  });
  // done toggles
  document.querySelectorAll('.exdone').forEach(btn=>btn.onclick=()=>{
    const id=btn.dataset.ex;w[id]=!w[id];save();
    const all=EXERCISES.every(e=>w[e.id]);
    if(all){toast('מעגל הושלם! שריר נבנה 💪🔥');}
    render();
  });
  // sets/reps steppers
  document.querySelectorAll('.setr').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k, d=+b.dataset.d;
    S.training[k]=Math.max(k==='sets'?1:3,Math.min(k==='sets'?6:30,S.training[k]+d));save();
    $(k==='sets'?'#valSets':'#valReps').textContent=S.training[k];
  });
};

/* ============================================================
   VIEW: Mentor chat  (rule-based supportive coach)
   ============================================================ */
views.mentor=function(){
  if(!S.chat.length)S.chat.push({who:'bot',text:mentorGreeting()});
  const quicks=['בא לי פחמימות 🍞','יש לי שפעת קיטו','אלקטרוליטים?','המשקל נתקע','מה לאכול עכשיו?','אני בקטוזיס?','תן לי מוטיבציה'];
  return `
  <div class="quick">${quicks.map(q=>`<button data-q="${esc(q)}">${q}</button>`).join('')}</div>
  <div class="chat" id="chat">
    ${S.chat.map(m=>`<div class="bubble ${m.who}">${esc(m.text)}</div>`).join('')}
  </div>
  <div class="chatbar">
    <input id="msg" placeholder="ספר/י לי מה עובר עליך..." autocomplete="off">
    <button id="send">➤</button>
  </div>`;
};
binders.mentor=function(){
  const scroll=()=>{const c=$('#chat');window.scrollTo({top:document.body.scrollHeight});};
  scroll();
  function send(text){
    text=text.trim();if(!text)return;
    S.chat.push({who:'me',text});save();
    const reply=mentorReply(text);
    $('#chat').insertAdjacentHTML('beforeend',`<div class="bubble me">${esc(text)}</div>`);
    setTimeout(()=>{
      S.chat.push({who:'bot',text:reply});save();
      $('#chat').insertAdjacentHTML('beforeend',`<div class="bubble bot">${esc(reply)}</div>`);
      scroll();
    },350);
    $('#msg').value='';scroll();
  }
  $('#send').onclick=()=>send($('#msg').value);
  $('#msg').onkeydown=e=>{if(e.key==='Enter')send($('#msg').value);};
  document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>send(b.dataset.q));
};

/* ---- the mentor "brain": empathetic, CBT-flavored, in Hebrew ---- */
function mentorGreeting(){
  const n=S.profile.name?` ${S.profile.name}`:'';
  return `היי${n} 🥑 אני המנטור האישי שלך — מומחה לדיאטה קטוגנית. אני כאן איתך בכל שלב, מהכניסה לקטוזיס ועד היעד.\nאפשר לשאול אותי כל דבר על קיטו: מה לאכול, שפעת קיטו, אלקטרוליטים, פחמימות מסתננות, סטול במשקל, או פשוט לבקש חיזוק. מה עובר עליך עכשיו?`;
}
function pick(a){return a[Math.floor((daysIn()+a.length*7+S.chat.length)%a.length)];} // דטרמיניסטי, מתחלף
const REPLIES=[
  {k:['שפעת','קיטו פלו','כאב ראש','בחילה','סחרחור','חלש','חולשה','שפעת קיטו'],a:[
`מה שאת/ה מרגיש/ה כנראה "שפעת הקיטו" — והחדשות הטובות: זה כמעט תמיד מחסור באלקטרוליטים, לא סימן להיכשל. הגוף מפריש הרבה נתרן ומים בשבוע הראשון.\nהפתרון המהיר: כוס מרק עוף מלוח + כוס מים גדולה עכשיו. תוך שעה תרגיש/י הבדל. גם קורט מלח בים בכל כוס מים עוזר.`,
`זה שלב חולף (2–5 ימים) בדרך להסתגלות לשומן. שלושת המפתחות: 🧂 מלח (3–5 ג׳ ליום), 🥑 אשלגן (אבוקדו/תרד), 💊 מגנזיום בערב.\nאל תורידי גם את השומן — הוא הדלק החדש שלך. תחזיקי מעמד, הצד השני שווה את זה.`]},
  {k:['אלקטרו','מלח','נתרן','מגנזיום','אשלגן','התכווצ','שריר','עצירות'],a:[
`אלקטרוליטים הם ה־ABC של קיטו מוצלח. יעד יומי בערך: נתרן 3–5 ג׳, אשלגן ~3–4 ג׳ (אבוקדו, תרד, סלמון), מגנזיום 300–400 מ״ג.\nהתכווצויות שרירים או עצירות? כמעט תמיד מגנזיום או מלח חסרים. מרק עצמות/עוף הוא הפתרון הכי פשוט.`,
`טיפ של מומחה: אל תפחדי ממלח בקיטו — ההיגיון ה"רגיל" של מעט מלח לא תקף כאן, כי הגוף מפריש הרבה נתרן. מלח מספיק מונע את רוב תופעות הלוואי.`]},
  {k:['פחמימ','סוכר','לחם','פסטה','אורז','קמח','נשנש','חטיף','מתוק','בא לי','פיתה','עוגה'],a:[
`התשוקה לפחמימה חזקה בהתחלה — היא נחלשת מאוד אחרי הסתגלות לשומן. עכשיו: כוס מים + קורט מלח, והמתן/י 10 דק׳. פעמים רבות זה בעצם צורך באלקטרוליטים.\nאם עדיין בא לך משהו — לך/י על קטו: קובייה שוקולד מריר 90%, חופן אגוזי מקדמיה, או ביצה קשה עם מלח. מנחם ולא מוציא מקטוזיס.`,
`שים/י לב: הרבה "רעב למתוק" בקיטו הוא הרגל או רגש, לא רעב אמיתי. בסולם 1–10 — כמה רעב/ה באמת?\nחלופה מתוקה־בטוחה: יוגורט שומן מלא + אריתריטול + קינמון, או "פאט בומב" משמן קוקוס וקקאו. בלי פחמימות, עם תחושת פינוק.`]},
  {k:['כוח','עייף','מותש','אנרגיה','לא בא לי','עצל'],a:[
`בשבועיים הראשונים ירידת אנרגיה היא נורמלית — הגוף עובר ממערכת סוכר למערכת שומן. שני חשודים עיקריים: מעט מלח, ומעט שומן.\nוודא/י שאכלת מספיק שומן היום ושתית מים עם מלח. ואם זה יום חלש — מספיק 5 דקות הליכה. לא צריך שיא, צריך לא לוותר.`,
`אחרי ההסתגלות (2–4 שבועות) רוב האנשים מדווחים על אנרגיה יציבה יותר מאי־פעם, בלי הצניחות של אחרי הצהריים. את/ה בדיוק בתוך המעבר — תחזיק/י מעמד.`]},
  {k:['נכשל','נכשלתי','פישלתי','אכלתי פחמימ','זללתי','הרסתי','אכזבתי','יצאתי מקטוזיס','יצאתי מקיטוזיס'],a:[
`עצור/י — לא נכשלת. אכילת פחמימה חד־פעמית לא מוחקת שבועות. כן, ייתכן שיצאת מקטוזיס לרגע, אבל חוזרים תוך יום־יומיים של הקפדה. זה הכול.\nהפעולה הבאה היא שקובעת: ארוחה קטוגנית — חלבון+שומן+ירקות עליים. הליכה קצרה עכשיו תעזור לנצל את הסוכר. נתחיל משם?`,

  {k:['עליתי','עלה','המשקל עלה','לא יורד','תקוע','סטול','פלטו','פלאטו','לא זז','נתקע'],a:[
`בקיטו, המספר על המאזניים מושפע מאוד ממים ואלקטרוליטים — עלייה של יום היא כמעט אף פעם לא שומן. תסתכל/י על מגמה של שבועיים, לא על יום בודד.\nאם באמת יש סטול: החשוד #1 הוא פחמימות מסתננות — רטבים, "מוצרי קיטו", אגוזים בכמות. בוא/י נבדוק את היומיים האחרונים יחד.`,
`שוברי סטול נפוצים בקיטו: 1) לוודא פחות מ־25 ג׳ פחמימות נטו, 2) לא להגזים בחלבון/אגוזים, 3) לנסות חלון אכילה (צום 16:8), 4) שינה ומלח. משנים גורם אחד לשבוע ובודקים.\nכמה זמן את/ה תקוע/ה? נבחר צעד אחד להתחיל ממנו.`]},
  {k:['מה לאכול','מה אוכלים','ארוחה','תפריט','לאכול עכשיו','מנה','רעיון','מתכון'],a:[
`עקרון הצלחת הקטוגנית: בסיס חלבון (ביצים/עוף/דג/בקר) + הרבה שומן בריא (שמן זית/חמאה/אבוקדו) + ירקות עליים דלי־פחמימה. בלי עמילנים.\nמהיר עכשיו: אומלט 3 ביצים בחמאה + אבוקדו + תרד מוקפץ. או טונה בשמן זית על מיטת חסה. רוצה שאתאים לפי מה שיש במקרר?`,
`רעיונות קטו קלים:\n🍳 בוקר: ביצים+אבוקדו, או יוגורט שומן מלא+אגוזים\n🥗 צהריים: סלמון/עוף + סלט גדול בשמן זית\n🥩 ערב: סטייק/המבורגר בלי לחם + ברוקולי בחמאה\n🥜 נשנוש: זיתים, גבינה צהובה, ביצה קשה, אגוזי מקדמיה.\nרוצה תפריט יום שלם?`]},
  {k:['מוטיבציה','דחיפה','חיזוק','עידוד','קשה לי','מיואש','מתייאש','מוותר'],a:[
`תזכור/י למה התחלת. לא בשביל מספר — בשביל אנרגיה יציבה, ראש צלול, ולהסתכל במראה ולחייך. קיטו נותן את זה כשמתמידים.\nוכבר עשית ${daysIn()+1} ימים${lostKg()>0?' וירדת '+lostKg()+' ק״ג':''}. זה לא מובן מאליו — זו בחירה יומית בעצמך. אני גאה בך.`,
`המסע הוא של שנה, לא של שבוע — וזה היתרון. אין צורך במושלמות, רק בהמשכיות. יום פחות טוב לא מבטל את כל השאר.\n${lostKg()>0?'כבר '+lostKg()+' ק״ג מאחוריך':'עשית את הצעד הכי קשה — התחלת'}. תמשיך/י. אני איתך בכל צעד. 💚`]},
  {k:['לחוץ','לחץ','חרד','עצוב','בדידות','משעמם','רגש','אוכל רגשי'],a:[

`ננשום יחד: שאיפה 4 שניות, החזקה 4, נשיפה 6. שלוש פעמים. זה מרגיע את הדחף האוטומטי.\nהרגש יעבור — הוא תמיד עובר. ואת/ה חזק/ה יותר ממה שנדמה לך.`]},
  {k:['קטוזיס','קיטוזיס','קטונים','מדידה','מקלונים','בקטוזיס','נכנסתי'],a:[

];
function mentorReply(text){
  const t=text.toLowerCase();
  for(const r of REPLIES){if(r.k.some(k=>t.includes(k)))return pick(r.a);}
  // ברירת מחדל — מכיל ומזמין, בגוון קטו
  return pick([
`אני שומע/ת אותך. ספר/י לי עוד — זה קשור לאוכל, לתשוקה לפחמימה, לאנרגיה, או למצב הרוח? נפרק את זה יחד לצעד קטן וקטוגני.`,
`תודה ששיתפת. בקיטו, כמו בכל דבר, מה שמתאים לך חשוב יותר מכל כלל. מה היית רוצה שיהיה אחרת מחר, ולו במעט?`,
`אני כאן. לפעמים עצם זה ששמים במילים את מה שקורה בפנים כבר מקל. מה הצעד הכי קטן שאת/ה מרגיש/ה מוכן/ה אליו היום?`]);
}
function mentorDaily(){
  const arr=[
`בוקר טוב 🥑 היום היעד פשוט: מתחת ל־25 ג׳ פחמימות נטו, מספיק שומן, וקורט מלח במים. הגוף שלך יודע לשרוף שומן — תן/י לו.`,
`תזכורת מומחה: אלקטרוליטים הם 90% מההרגשה הטובה בקיטו. מלח, מים ומגנזיום — והאנרגיה מגיעה בעקבותיהם.`,
`את/ה כבר ${daysIn()+1} ימים במסע. ${lostKg()>0?'כבר '+lostKg()+' ק״ג פחות':'ההתחלה היא הצעד הכי קשה — ועשית אותו'}. ההתמדה היא שמנצחת, לא המושלמות.`,
`התשוקה לסוכר נחלשת ככל שמתמידים — כל יום קטו הוא עוד לבנה בהסתגלות לשומן. תחזיק/י מעמד, הצד השני שקט ויציב.`,
`בקיטו לא רעבים — אוכלים שומן שמשביע לשעות. אם בא מתוק, זה לרוב רגש או מחסור במלח. עצירה קטנה לפני כל ביס עושה את ההבדל.`,
`אם אתמול הייתה החלקה לפחמימה — היום דף חדש. חוזרים לקטו בארוחה הבאה, בלי דרמה. אני מאמין/ה בך. 💚`];
  return arr[daysIn()%arr.length];
}

  <details class="acc"><summary>מה עושים במסעדה?</summary><div class="inner"><ul><li>מנה על בסיס בשר/דג + שמן זית</li><li>סלט ירוק עם אבוקדו במקום צ׳יפס/פחמימה</li><li>בלי לחמנייה, בלי רטבים מתוקים</li><li>קינוח? קוביית שוקולד מריר או פשוט קפה</li></ul></div></details>
  <details class="acc"><summary>ואם אכלתי פחמימות בטעות?</summary><div class="inner">לא נורא ולא נצחי. פשוט חוזרים לקטו בארוחה הבאה — שומן+חלבון+ירקות עליים. הליכה קצרה עוזרת לנצל את הסוכר. יום אחד לא מוחק שבועות של עבודה.</div></details>

  <div class="note-box" style="margin-top:14px">⚕️ <span>דיאטה קטוגנית אינה מתאימה לכולם (למשל הריון, סוכרת עם אינסולין, בעיות כליה/כבד, לבלב). ירידה של 40 ק״ג היא יעד גדול — התחילי בליווי רופא/ה ותזונאי/ת, במיוחד אם יש מצב רפואי או תרופות.</span></div>
  `;
};

views.track=function(){
  return `
  <div class="card">
    <h2>⚖️ שקילה שבועית</h2>
    <p class="muted" style="font-size:12.5px;margin-bottom:10px">הכי טוב לשקול פעם בשבוע, אותו יום, בבוקר. עקביות חשובה מהמספר עצמו.</p>
    <div class="row">
      <input class="input grow" id="wKg" type="number" inputmode="decimal" step="0.1" placeholder="משקל בק״ג (${currentWeight()})">
      <button class="btn sm" id="wSave" style="flex:0 0 auto">שמירה</button>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:baseline">
      <h2>מגמת המשקל</h2>
      <span class="pill ${lostKg()>0?'brand':''}">${lostKg()>0?'−'+lostKg()+' ק״ג':'טרם'}</span>
    </div>
    ${weightChart()}
  </div>

  <div class="tiles">
    <div class="tile"><span class="lbl">התחלה</span><b>${S.profile.startWeight}</b><span class="muted" style="font-size:12px">ק״ג</span></div>
    <div class="tile"><span class="lbl">יעד</span><b>${goalWeight()}</b><span class="muted" style="font-size:12px">ק״ג</span></div>
    <div class="tile"><span class="lbl">נשאר</span><b>${Math.max(0,+(currentWeight()-goalWeight()).toFixed(1))}</b><span class="muted" style="font-size:12px">ק״ג ליעד</span></div>
    <div class="tile"><span class="lbl">ימי רצף</span><b>🔥 ${S.streak}</b><span class="muted" style="font-size:12px">ברציפות</span></div>
  </div>

  <div class="section-title">מפת המסע · 12 חודשים</div>
  <div class="card road">
    ${ROADMAP.map(m=>{
      const done=lostKg()>=m.kg;
      const now=!done && ROADMAP.filter(x=>x.kg<m.kg).every(x=>lostKg()>=x.kg);
      return `<div class="milestone ${done?'done':now?'now':''}">
        <div class="dot">${done?'✓':m.m}</div>
        <div class="body"><h3>${m.title}</h3><span class="kg">אבן דרך: −${m.kg} ק״ג</span><p>${m.p}</p></div>
      </div>`;}).join('')}
  </div>

  <div class="card tight">
    <div class="row" style="gap:8px">
      <button class="btn ghost grow sm" id="exportBtn">⬇️ גיבוי הנתונים</button>
      <button class="btn danger grow sm" id="resetBtn">איפוס מלא</button>
    </div>
  </div>
  `;
};
binders.track=function(){
  $('#wSave').onclick=()=>{
    const v=parseFloat($('#wKg').value);
    if(!v||v<30||v>400){toast('הזן/י משקל תקין');return;}
    const d=todayISO();
    const ex=S.weights.find(w=>w.date===d);
    if(ex)ex.kg=v;else S.weights.push({date:d,kg:v});
    S.weights.sort((a,b)=>a.date.localeCompare(b.date));
    save();
    const gained=v>currentWeightPrev(v);
    toast(lostKg()>0?`יופי! ירדת ${lostKg()} ק״ג בסך הכול 🎉`:'נרשם. ממשיכים במסע 💪');
    render();
  };
  $('#exportBtn').onclick=()=>{
    const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='mentor-backup-'+todayISO()+'.json';a.click();toast('קובץ גיבוי הורד');
  };
  $('#resetBtn').onclick=()=>{
    if(confirm('לאפס את כל הנתונים ולהתחיל מחדש? פעולה זו אינה הפיכה.')){
      localStorage.removeItem(KEY);S=structuredClone(DEFAULT);TAB='home';render();
    }
  };
};
function currentWeightPrev(exclude){
  const arr=S.weights.filter(w=>w.kg!==exclude);
  return arr.length?arr[arr.length-1].kg:S.profile.startWeight;
}
function weightChart(){
  const pts=[{date:S.profile.startDate,kg:S.profile.startWeight},...S.weights];
  if(pts.length<2)return `<p class="muted center" style="padding:24px 0;font-size:13px">רשמו שקילה נוספת כדי לראות את הגרף מתחיל להיווצר 📉</p>`;
  const W=440,H=170,pad=28;
  const kgs=pts.map(p=>p.kg).concat([goalWeight()]);
  const min=Math.min(...kgs)-1,max=Math.max(...kgs)+1;
  const xs=pts.map((p,i)=>pad+(i/(pts.length-1))*(W-pad*1.4));
  const y=kg=>pad+ (1-(kg-min)/(max-min))*(H-pad*1.7);
  const line=pts.map((p,i)=>`${i?'L':'M'}${xs[i].toFixed(1)},${y(p.kg).toFixed(1)}`).join(' ');
  const area=`${line} L${xs[xs.length-1].toFixed(1)},${H-pad} L${xs[0].toFixed(1)},${H-pad} Z`;
  const gY=y(goalWeight());
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:6px" preserveAspectRatio="none">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f7a5c" stop-opacity=".22"/><stop offset="1" stop-color="#0f7a5c" stop-opacity="0"/></linearGradient></defs>
    <line x1="${pad}" y1="${gY}" x2="${W-pad*.4}" y2="${gY}" stroke="#caa54a" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="${W-pad*.4}" y="${gY-5}" text-anchor="end" font-size="10" fill="#caa54a" font-weight="700">יעד ${goalWeight()}</text>
    <path d="${area}" fill="url(#g)"/>
    <path d="${line}" fill="none" stroke="#0f7a5c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${xs[i].toFixed(1)}" cy="${y(p.kg).toFixed(1)}" r="${i===pts.length-1?4.5:3}" fill="#fff" stroke="#0f7a5c" stroke-width="2.5"/>`).join('')}
    <text x="${xs[xs.length-1].toFixed(1)}" y="${(y(pts[pts.length-1].kg)-9).toFixed(1)}" text-anchor="middle" font-size="11" fill="#0f7a5c" font-weight="800">${pts[pts.length-1].kg}</text>
  </svg>`;
}

        <div class="grow" style="background:var(--accent-100);border-radius:11px;padding:9px"><b style="font-size:19px;color:#b45b1e">${fat}ג׳</b><div class="muted" style="font-size:11px;font-weight:800">🧈 שומן</div></div>
        <div class="grow" style="background:var(--brand-100);border-radius:11px;padding:9px"><b style="font-size:19px;color:var(--brand-600)">${prot}ג׳</b><div class="muted" style="font-size:11px;font-weight:800">🍗 חלבון</div></div>
        <div class="grow" style="background:var(--bg-soft);border-radius:11px;padding:9px"><b style="font-size:19px;color:var(--good)">${carb}ג׳</b><div class="muted" style="font-size:11px;font-weight:800">🥦 פחמ׳ נטו</div></div>
      </div></div>
    <div class="note-box" style="margin:4px 0 14px">⚕️ <span>היעד שלך שאפתני ומכובד. דיאטה קטוגנית אינה מתאימה לכל אחד — התחילי בליווי רופא/ה ותזונאי/ת, במיוחד אם יש מצב רפואי או תרופות. אני כאן ללוות אותך בכל יום.</span></div>
    <button class="btn" id="obFinish">יוצאים לדרך 🥑</button>
  </div>`;
}
function bindOnboarding(){
  const d=OB.data;
  const nextBtn=$('#obNext'),backBtn=$('#obBack'),finBtn=$('#obFinish');
  if(backBtn)backBtn.onclick=()=>{collectStep();OB.step--;render2ob();};
  if(nextBtn)nextBtn.onclick=()=>{if(!collectStep())return;OB.step++;render2ob();};
  if(finBtn)finBtn.onclick=()=>{
    S.profile={...OB.data};
    S.profile.startDate=todayISO();
    S.targets.calories=calorieTarget();
    S.weights=[{date:todayISO(),kg:S.profile.startWeight}];
    S.onboarded=true;save();TAB='home';render();
    toast('ברוך/ה הבא/ה למסע שלך! 🌿');
  };
  // step-specific bindings
  if(OB.step===1){
    document.querySelectorAll('#fSex button').forEach(b=>b.onclick=()=>{d.sex=b.dataset.v;
      document.querySelectorAll('#fSex button').forEach(x=>x.classList.remove('on'));b.classList.add('on');});
  }
  if(OB.step===2){
    document.querySelectorAll('#fAct button').forEach(b=>b.onclick=()=>{d.activity=+b.dataset.v;
      document.querySelectorAll('#fAct button').forEach(x=>x.classList.remove('on'));b.classList.add('on');});
  }
  if(OB.step===3){
    const sl=$('#fGoal');const upd=()=>{d.goalLoss=+sl.value;$('#goalNum').textContent=sl.value;paintGoalCalc();};
    sl.oninput=upd;paintGoalCalc();
  }
}
function paintGoalCalc(){
  const d=OB.data;const box=$('#goalCalc');if(!box)return;
  const start=d.startWeight||0;
  const target=start?(start-d.goalLoss).toFixed(1):'—';
  const wks=Math.ceil(d.goalLoss/0.75);
  box.innerHTML=`🎯 מ־<b>${start||'?'}</b> ל־<b>${target}</b> ק״ג · בקצב בריא של כ־0.75 ק״ג לשבוע זה כ־<b>${wks} שבועות</b> (${Math.round(wks/4.3)} חודשים בערך).`;
}
function collectStep(){
  const d=OB.data;
  if(OB.step===1){
    d.name=($('#fName')?.value||'').trim();
    d.age=Math.max(14,Math.min(100,+($('#fAge')?.value||d.age)));
  }
  if(OB.step===2){
    d.height=Math.max(120,Math.min(230,+($('#fHeight')?.value||d.height)));
    const w=parseFloat($('#fWeight')?.value);
    if(!w||w<30||w>400){toast('הזן/י משקל נוכחי תקין כדי להמשיך');return false;}
    d.startWeight=w;
  }
  return true;
}
function render2ob(){$('#app').innerHTML=onboardingView();bindOnboarding();window.scrollTo({top:0});}

/* ============================================================
   Boot
   ============================================================ */
render();
</script>
</body>
</html>
